syntax = "proto3";

package ratelimiter.v1;

option go_package = "distributed-rate-limiter/proto/ratelimiter/v1;ratelimiterv1";

service RateLimiter {
  // Allow checks whether a request should be permitted according to configured rate limits.
  rpc Allow(AllowRequest) returns (AllowResponse);
}

message AllowRequest {
  // Key represents the rate limit subject (e.g. user ID, IP address, or API key).
  string key = 1;

  // RuleId optionally matches a specific rule configured on the server.
  string rule_id = 2;

  // Cost is the token/counter cost of this request (default is 1).
  int64 cost = 3;
}

message AllowResponse {
  // Allowed is true if request is permitted, false if rate limited.
  bool allowed = 1;

  // Limit is the maximum allowed requests in the configured window.
  int64 limit = 2;

  // Remaining is the number of remaining requests permitted in the current window.
  int64 remaining = 3;

  // RetryAfterMs is the duration in milliseconds the client must wait before retrying (on rejection).
  int64 retry_after_ms = 4;

  // ResetAtMs is the Unix epoch timestamp in milliseconds when the current window resets.
  int64 reset_at_ms = 5;

  // RuleId is the identifier of the rule that was applied.
  string rule_id = 6;
}
